name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      # Just accept the licenses so Gradle can fetch any missing platform/build-tools.
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install
        run: npm ci

      - name: Copy web app into the Android project
        run: |
          npm run build:www
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.2.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OpenPlayer-1.2.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPlayer-apk
          path: OpenPlayer-*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Open Player 1.2.${{ github.run_number }}
          make_latest: true
          files: OpenPlayer-*.apk
          body: |
            **Install:** download `OpenPlayer-1.2.${{ github.run_number }}.apk` on your phone and open it.
            Android will ask to allow installs from your browser or file manager — allow it once.

            No ads. No tracking. Your videos and music never leave your phone.
