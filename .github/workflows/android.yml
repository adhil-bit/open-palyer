name: Android build & release

on:
  push:
    # main → the normal download.  beta → a test build at /download/android-beta, tried before main.
    branches: [main, beta]
    # Website-only changes don't need a new app version
    paths-ignore: ['index.html', 'img/**', 'api/**', 'vercel.json', 'release.json', '*.md']
  workflow_dispatch:

permissions:
  contents: write      # create the GitHub Release
  id-token: write      # sign the build attestation / deploy Pages
  attestations: write  # store the build attestation
  pages: write         # publish the website

concurrency:
  group: android-apk-${{ github.ref_name }}
  cancel-in-progress: true

env:
  APP_VER: "1.6"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true when the private signing key has been added as repository secrets (see README)
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle   # reuse downloaded libraries between builds (fewer downloads, no rate limits)

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      # Just accept the licenses so Gradle can fetch any missing platform/build-tools.
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Version
        id: ver
        run: |
          if [ "${{ github.ref_name }}" = "beta" ]; then S="-beta"; else S=""; fi
          echo "version=${APP_VER}.${{ github.run_number }}$S" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Copy web app into the Android project
        run: |
          npm run build:www
          npx cap sync android

      - name: Signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
            echo "Signing with the private release key."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: this APK is signed with the public test key. Add the private key before sharing releases (see README)."
          fi

      - name: Build the APK (direct download, full edition)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # 32-bit phones (old/budget): a separate, smaller APK
          ./gradlew assembleFullRelease -Pabis=armeabi-v7a --no-daemon --stacktrace
          mkdir -p "$RUNNER_TEMP/apk32" && cp app/build/outputs/apk/full/release/app-full-release.apk "$RUNNER_TEMP/apk32/"
          # 64-bit phones (nearly all): the main download
          ./gradlew assembleFullRelease -Pabis=arm64-v8a --no-daemon --stacktrace

      - name: Build the Google Play bundle (only with the private key)
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease --no-daemon --stacktrace

      - name: Collect release files
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/full/release/app-full-release.apk "dist/OpenPlayer-$V.apk"
          cp "$RUNNER_TEMP/apk32/app-full-release.apk" "dist/OpenPlayer-$V-32bit.apk"
          rm -f "$RUNNER_TEMP/signing.jks"
          AAB=android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if [ -f "$AAB" ]; then cp "$AAB" "dist/OpenPlayer-$V-play.aab"; fi
          ls -l dist

      - name: Checksums and signing certificate
        id: verify
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          APK="dist/OpenPlayer-$V.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          (cd dist && ls OpenPlayer-* | xargs sha256sum > SHA256SUMS.txt)
          {
            echo "sha256=$SHA"
            echo "cert=$CERT"
            echo "size=$(stat -c %s "$APK")"
          } >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA"
          echo "Signing certificate SHA-256: $CERT"

      # Proves the APK was built by GitHub Actions from this exact commit.
      # GitHub offers this for public repositories (private ones need GitHub Enterprise Cloud),
      # so it is skipped quietly until the repository is public.
      - name: Build provenance attestation
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/OpenPlayer-*

      # Needs a free VirusTotal API key saved as the repository secret VT_API_KEY.
      - name: VirusTotal scan
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          V: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.verify.outputs.sha256 }}
        run: |
          set +e
          if [ -z "$VT_API_KEY" ]; then
            echo "VT_API_KEY secret not set: skipping the scan."
            echo "status=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ID=$(curl -sS --fail -H "x-apikey: $VT_API_KEY" -F "file=@dist/OpenPlayer-$V.apk" \
               https://www.virustotal.com/api/v3/files | jq -r '.data.id')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Upload to VirusTotal failed."
            echo "status=failed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "link=https://www.virustotal.com/gui/file/$SHA" >> "$GITHUB_OUTPUT"
          # The free API allows 4 requests a minute: check every 20 s for up to ~7 minutes.
          for i in $(seq 1 20); do
            sleep 20
            R=$(curl -sS -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/$ID")
            if [ "$(echo "$R" | jq -r '.data.attributes.status')" = "completed" ]; then
              MAL=$(echo "$R" | jq '.data.attributes.stats.malicious + .data.attributes.stats.suspicious')
              ENG=$(echo "$R" | jq '[.data.attributes.stats | .malicious, .suspicious, .undetected, .harmless] | add')
              { echo "status=done"; echo "flagged=$MAL"; echo "engines=$ENG"; } >> "$GITHUB_OUTPUT"
              echo "VirusTotal: $MAL of $ENG engines flagged the APK"
              exit 0
            fi
          done
          echo "status=pending" >> "$GITHUB_OUTPUT"
          echo "VirusTotal is still scanning; the report link will show the result."

      - name: Release info for the website
        env:
          V: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.verify.outputs.sha256 }}
          CERT: ${{ steps.verify.outputs.cert }}
          SIZE: ${{ steps.verify.outputs.size }}
          VT_STATUS: ${{ steps.vt.outputs.status }}
          VT_LINK: ${{ steps.vt.outputs.link }}
          VT_FLAGGED: ${{ steps.vt.outputs.flagged }}
          VT_ENGINES: ${{ steps.vt.outputs.engines }}
          ATTEST_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          jq -n \
            --arg version "$V" --arg apk "OpenPlayer-$V.apk" --arg sha256 "$SHA" --arg cert "$CERT" \
            --arg size "$SIZE" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg vtStatus "$VT_STATUS" --arg vtLink "$VT_LINK" --arg vtFlagged "$VT_FLAGGED" --arg vtEngines "$VT_ENGINES" \
            --arg attestation "$ATTEST_URL" \
            --arg release "https://github.com/${{ github.repository }}/releases/tag/v$V" --arg commit "${{ github.sha }}" \
            '{ version: $version, apk: $apk, download: "download/OpenPlayer.apk", size: ($size | tonumber? // null),
               sha256: $sha256, certSha256: $cert, date: $date,
               virustotal: { status: $vtStatus, link: $vtLink,
                             flagged: ($vtFlagged | tonumber? // null), engines: ($vtEngines | tonumber? // null) },
               attestation: $attestation, release: $release, commit: $commit }' > dist/release.json
          cat dist/release.json

      - name: Release notes
        env:
          V: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.verify.outputs.sha256 }}
          CERT: ${{ steps.verify.outputs.cert }}
          VT_STATUS: ${{ steps.vt.outputs.status }}
          VT_LINK: ${{ steps.vt.outputs.link }}
          VT_FLAGGED: ${{ steps.vt.outputs.flagged }}
          VT_ENGINES: ${{ steps.vt.outputs.engines }}
          ATTEST_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          case "$VT_STATUS" in
            done)    VT="[$VT_FLAGGED of $VT_ENGINES security engines flagged it]($VT_LINK)" ;;
            pending) VT="[Scan report]($VT_LINK) (still scanning when this release was made)" ;;
            *)       VT="Not scanned for this release" ;;
          esac
          if [ -n "$ATTEST_URL" ]; then PROV="[GitHub build attestation]($ATTEST_URL)"; else PROV="Available once the source code is public"; fi
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            KEYNOTE="> ⚠️ **Test build:** signed with the public test key, not the official release key. Don't share this one."
          else KEYNOTE=""; fi
          AAB_NOTE=""
          if [ -f "dist/OpenPlayer-$V-play.aab" ]; then AAB_NOTE="- \`OpenPlayer-$V-play.aab\`: Google Play edition, for uploading in Play Console (not for installing)."; fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          $KEYNOTE

          **Install:** download \`OpenPlayer-$V.apk\` on your phone and open it. Android asks once to allow installs from your browser or file manager.

          No ads. No tracking. Your videos and music never leave your phone.

          ### Check this download is genuine

          | | |
          |---|---|
          | APK SHA-256 | \`$SHA\` |
          | Signing certificate SHA-256 | \`$CERT\` |
          | Virus scan (VirusTotal) | $VT |
          | Build provenance | $PROV |

          Check the file before installing:
          - Windows: \`certutil -hashfile OpenPlayer-$V.apk SHA256\`
          - Mac: \`shasum -a 256 OpenPlayer-$V.apk\`
          - Linux: \`sha256sum OpenPlayer-$V.apk\`

          After installing, **Settings → About → Verify app** shows the signing fingerprint. It must match the one above.

          ### Files
          - \`OpenPlayer-$V.apk\`: install this on your phone (64-bit; nearly all phones).
          - \`OpenPlayer-$V-32bit.apk\`: only for very old phones where the main one won't install.
          - \`SHA256SUMS.txt\`, \`release.json\`: checksums and release details.
          $AAB_NOTE
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: OpenPlayer-${{ steps.ver.outputs.version }}
          path: |
            dist/OpenPlayer-*
            dist/SHA256SUMS.txt
            dist/release.json

      - name: Stable download name (the website's /download/android link points here)
        run: |
          mkdir -p dist/stable
          cp "dist/OpenPlayer-${{ steps.ver.outputs.version }}.apk" dist/stable/OpenPlayer.apk
          cp "dist/OpenPlayer-${{ steps.ver.outputs.version }}-32bit.apk" dist/stable/OpenPlayer-32bit.apk

      # Test builds: one rolling pre-release, never the "latest" one.
      - name: Publish the test build (beta)
        if: github.ref_name == 'beta'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-beta
          target_commitish: ${{ github.sha }}
          name: Open Player test build (beta)
          prerelease: true
          make_latest: false
          body: |
            Test build ${{ steps.ver.outputs.version }} from commit ${{ github.sha }}. Try it before it becomes the normal download.
            Download: https://open-play-adfree.vercel.app/download/android-beta
          files: |
            dist/stable/OpenPlayer.apk
            dist/stable/OpenPlayer-32bit.apk

      # Before replacing the normal download, keep the current one as "previous" (one tap to go back).
      - name: Keep the current version as "previous"
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prev
          gh release download --repo "${{ github.repository }}" --pattern OpenPlayer.apk --pattern OpenPlayer-32bit.apk -D prev || true
          ls -l prev
      - name: Publish the previous version
        if: github.ref_name == 'main' && hashFiles('prev/OpenPlayer.apk') != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-previous
          name: Open Player previous version
          prerelease: true
          make_latest: false
          body: |
            The version before the current download, in case an update breaks something.
            Download: https://open-play-adfree.vercel.app/download/android-previous
          files: |
            prev/OpenPlayer.apk
            prev/OpenPlayer-32bit.apk

      - name: Publish to Releases
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Open Player ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/OpenPlayer-*
            dist/stable/OpenPlayer.apk
            dist/stable/OpenPlayer-32bit.apk
            dist/SHA256SUMS.txt
            dist/release.json

      # The Vercel website reads release.json from the repo: save this release's details there.
      # "[skip ci]" stops this commit from starting another build.
      - name: Save release details for the website
        if: github.ref_name == 'main'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          jq '.download = "/download/android"' dist/release.json > "$RUNNER_TEMP/release.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            rm -rf "$RUNNER_TEMP/site-info"; git worktree prune
            git fetch -q --depth=1 origin main
            git worktree add -q --detach "$RUNNER_TEMP/site-info" FETCH_HEAD
            cp "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/site-info/release.json"
            cd "$RUNNER_TEMP/site-info"
            git add release.json
            if git diff --cached --quiet; then cd "$GITHUB_WORKSPACE"; break; fi
            git commit -q -m "Website: release details for $V [skip ci]"
            if git push -q origin HEAD:main; then cd "$GITHUB_WORKSPACE"; break; fi
            cd "$GITHUB_WORKSPACE"; sleep 5
          done

      # The website, with the APK and its verification details next to it.
      - name: Prepare the website
        if: github.ref_name == 'main'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p site/download
          cp -r index.html sw.js app .nojekyll site/
          cp dist/release.json site/   # keeps download: "download/OpenPlayer.apk" for this copy
          cp "dist/OpenPlayer-$V.apk" site/download/OpenPlayer.apk
          cp dist/SHA256SUMS.txt site/download/

      - uses: actions/upload-pages-artifact@v5
        if: github.ref_name == 'main'
        with:
          path: site
          include-hidden-files: true

  # Needs: Settings → Pages → Source: "GitHub Actions".
  # Pages for a private repository needs a paid GitHub plan, so this step may fail until then.
  website:
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
