apply plugin: 'com.android.application'

android {
    namespace = "io.github.adhilbit.openplayer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.adhilbit.openplayer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the build number so every APK can install over the previous one.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two versions of the app:
    //   full - the APK on GitHub / the website. Includes "All files access" to find videos in hidden folders.
    //   play - for Google Play, whose policy doesn't allow "All files access" for video players.
    flavorDimensions "store"
    productFlavors {
        full {
            dimension "store"
            // The direct APK ships the FFmpeg decoders for phones only (keeps the download smaller).
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
        play { dimension "store" }   // Play delivers the right decoders per phone from the .aab
    }
    signingConfigs {
        // Public test key: only for local builds and forks. Official releases are signed with
        // the private key from the SIGNING_* GitHub secrets (see README), never this one.
        debug {
            storeFile file('openplayer-debug.keystore')
            storePassword 'openplayer'
            keyAlias 'openplayer'
            keyPassword 'openplayer'
        }
        release {
            def ks = System.getenv("SIGNING_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("SIGNING_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    // Second playback engine: Media3 (Apache-2.0) + NextLib FFmpeg decoders (GPL-3)
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.18.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
